name: Acceptance
about: Request independent acceptance
body:
  - type: markdown
    attributes:
      value: "Owner-directed task: the owner approves scope and merge; どっさん coordinates; Codex implements/tests; independent review is separate. This form does not authorize GitHub writes or start Work/Codex."
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What journey or artifact needs acceptance? }
    validations: { required: true }
  - type: dropdown
    id: environment
    attributes: { label: Environment, options: [Preview, Production] }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Optional routes/journeys }
