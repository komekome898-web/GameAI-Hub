name: Acceptance
about: Request independent acceptance
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What journey or artifact needs acceptance? }
    validations: { required: true }
  - type: dropdown
    id: environment
    attributes: { label: Environment, options: [Preview, Production] }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Optional routes/journeys }
