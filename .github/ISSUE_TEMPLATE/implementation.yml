name: Implementation
about: Start an implementation task
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: Describe the intended user/product outcome. }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [Normal, High, Critical] }
  - type: textarea
    id: scope
    attributes: { label: Optional scope, description: Constraints or exclusions only; bindings and claims are generated. }
