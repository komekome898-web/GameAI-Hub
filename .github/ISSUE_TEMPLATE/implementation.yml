name: Implementation
about: Start an implementation task
body:
  - type: markdown
    attributes:
      value: "Owner-directed task: the owner approves scope and merge; どっさん coordinates; Codex implements/tests; independent review is separate. This form does not authorize GitHub writes or start Work/Codex."
  - type: textarea
    id: goal
    attributes: { label: Goal, description: Describe the intended user/product outcome. }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [Normal, High, Critical] }
  - type: textarea
    id: scope
    attributes: { label: Optional scope, description: Constraints or exclusions only; record approved scope and existing Issue/branch/PR/SHA lineage; no automatic dispatch. }
