name: Research
about: Start a concise research task
body:
  - type: markdown
    attributes:
      value: "Owner-directed task: the owner approves scope and merge; どっさん coordinates; Codex implements/tests; independent review is separate. This form does not authorize GitHub writes or start Work/Codex."
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What decision must this research enable? }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [Normal, High, Critical] }
  - type: textarea
    id: scope
    attributes: { label: Optional scope, description: Include/exclude constraints; read-only review needs no push checkpoint; record actual evidence and lineage. }
