name: PR orchestration observation
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  check_run:
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
concurrency:
  group: gameai-orchestration-manifest-writer
  queue: max
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fence changed PR heads and invalidate stale approval
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_GITHUB_EVENT: ${{ github.event_path }}
        run: python scripts/orchestration_observe.py
      - name: Reconcile exact-SHA Preview readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/orchestration_preview_readiness_reconcile.py
      - name: Replay authorized post-merge recovery without changing Production SHA
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 101 }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_GITHUB_EVENT: ${{ github.event_path }}
        run: python scripts/orchestration_post_merge_recovery_driver.py
