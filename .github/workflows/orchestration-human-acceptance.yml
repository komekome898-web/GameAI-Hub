name: Orchestration human Acceptance attestation
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: gameai-orchestration-manifest-writer
  queue: max
jobs:
  attest:
    if: ${{ github.event.issue.pull_request && github.actor == github.repository_owner && contains(github.event.comment.body, '<!-- gameai-human-acceptance-attestation:v1 -->') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact owner-attested Work candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_GITHUB_EVENT: ${{ github.event_path }}
        run: python scripts/orchestration_human_acceptance.py
