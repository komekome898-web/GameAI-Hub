name: Orchestration projection reconciliation
on:
  schedule: [{ cron: "23 */6 * * *" }]
  workflow_dispatch:
    inputs:
      issue: { description: Optional issue number, required: false, type: string }
permissions:
  contents: read
  issues: write
concurrency: gameai-orchestration-manifest-writer
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          ORCH_ISSUE: ${{ inputs.issue }}
        run: python scripts/orchestration_github.py reconcile
