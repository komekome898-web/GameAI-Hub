name: Orchestration initialize
on:
  workflow_dispatch:
    inputs:
      issue: { description: Canonical issue number, required: true, type: string }
      canonical_task_version: { description: Pinned contract version, required: true, default: "1", type: string }
      critical: { description: Require work-critical, required: true, default: false, type: boolean }
permissions:
  contents: read
  issues: write
concurrency:
  group: gameai-orchestration-${{ inputs.issue }}
  queue: max
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize fail-closed manifest and reconcile projection
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_ISSUE: ${{ inputs.issue }}
          ORCH_TASK_VERSION: ${{ inputs.canonical_task_version }}
          ORCH_CRITICAL: ${{ inputs.critical }}
          ORCH_PREVIEW_ORIGINS: ${{ vars.ORCH_PREVIEW_ORIGINS }}
          ORCH_PRODUCTION_ORIGINS: ${{ vars.ORCH_PRODUCTION_ORIGINS }}
        run: python scripts/orchestration_github.py init
