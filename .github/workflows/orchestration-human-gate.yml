name: Orchestration human merge authorization
on:
  workflow_dispatch:
    inputs:
      issue: { description: Canonical Issue, required: true, type: string }
permissions:
  contents: read
  issues: write
  statuses: write
concurrency:
  group: gameai-orchestration-manifest-writer
  queue: max
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record authorization only (this workflow never merges)
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_EVENT_NAME: orchestration-human-approval
          ORCH_SENDER: ${{ github.actor }}
          ISSUE: ${{ inputs.issue }}
        run: |
          ORCH_PAYLOAD="$(jq -nc --argjson issue "$ISSUE" '{issue:$issue}')"
          export ORCH_PAYLOAD
          python scripts/orchestration_github.py ingest
