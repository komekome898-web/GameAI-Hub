name: Orchestration human control
on:
  workflow_dispatch:
    inputs:
      issue: { description: Canonical Issue, required: true, type: string }
      operation:
        description: Human decision
        required: true
        default: approve
        type: choice
        options: [approve, cancel, supersede, migrate_task_version]
      new_task_version: { description: Migration only - new task version, required: false, type: string }
      successor_issue: { description: Supersession only - initialized replacement Issue, required: false, type: string }
permissions:
  contents: read
  issues: write
  statuses: write
concurrency:
  group: gameai-orchestration-${{ inputs.issue }}
  queue: max
jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply a human-authorized operation (never merge)
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_ISSUE: ${{ inputs.issue }}
          ORCH_OPERATION: ${{ inputs.operation }}
          ORCH_NEW_TASK_VERSION: ${{ inputs.new_task_version }}
          ORCH_SUCCESSOR_ISSUE: ${{ inputs.successor_issue }}
          ORCH_AUTHORIZED_AT: ${{ github.event.repository.updated_at }}
        run: python scripts/orchestration_github.py human
