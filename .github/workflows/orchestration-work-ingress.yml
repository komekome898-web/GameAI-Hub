name: Orchestration Work acceptance ingress
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write
concurrency:
  group: gameai-orchestration-manifest-writer
  queue: max
jobs:
  ingest:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '<!-- gameai-acceptance:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Apply exactly one connector-authored current-claim candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_GITHUB_EVENT: ${{ github.event_path }}
        run: python scripts/orchestration_work_ingress.py
