name: beginner-acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e:webkit
      - name: Preserve WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-mobile-evidence
          path: |
            test-results/
            docs/screenshots/webkit-mobile/
          if-no-files-found: warn
          retention-days: 14
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beginner-acceptance-evidence
          path: |
            test-results/
            docs/screenshots/
          if-no-files-found: warn
          retention-days: 14
