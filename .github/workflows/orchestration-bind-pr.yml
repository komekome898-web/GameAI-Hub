name: Orchestration bind implementation PR
on:
  workflow_dispatch:
    inputs:
      issue: { description: Canonical Issue, required: true, type: string }
      pr: { description: Pull request number, required: true, type: string }
      branch: { description: Exact head branch, required: true, type: string }
      head_sha: { description: Exact 40-character head SHA, required: true, type: string }
      recovery: { description: Explicitly replace an existing binding, required: true, default: false, type: boolean }
permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write
concurrency:
  group: gameai-orchestration-${{ inputs.issue }}
  queue: max
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact repository PR branch and head
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          BRANCH: ${{ inputs.branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          ORCH_PAYLOAD="$(jq -nc --argjson issue "$ISSUE" --argjson pr "$PR" --arg branch "$BRANCH" --arg sha "$HEAD_SHA" --argjson recovery "$RECOVERY" '{issue:$issue,pr:$pr,branch:$branch,sha:$sha,recovery:$recovery}')"
          export ORCH_PAYLOAD
          python scripts/orchestration_github.py bind
