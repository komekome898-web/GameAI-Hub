name: Orchestration owner transition relay
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
jobs:
  relay:
    if: ${{ !github.event.issue.pull_request && github.actor == github.repository_owner && contains(github.event.comment.body, '<!-- gameai-transition-command:v1 -->') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relay owner command through trusted repository_dispatch ingress
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_GITHUB_EVENT: ${{ github.event_path }}
        run: python scripts/orchestration_transition_relay.py
